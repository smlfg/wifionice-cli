[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wifionice"
version = "0.1.0"
description = "WIFIonICE-CLI: Auto-Login ins Zug-WLAN (wifi.bahn.de), Status, Speed-Check"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Samuel Fleig" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "mcp>=1.9.0,<2"]
keyring = ["keyring>=25.0"]

[project.scripts]
wifionice = "wifionice_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wifionice_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
asyncio_mode = "auto"
